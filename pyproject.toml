# Development tools only: the images' own scripts use the standard library.
[project]
name = "images"
version = "0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "actionlint-kjanat==1.17.1",
    "hadolint-py==2.15.1.3",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "ruff==0.17.6",
    "shellcheck-py==0.11.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["B", "BLE", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "single"
