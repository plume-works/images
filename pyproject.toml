[project]
name = "images"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["images", "scripts"]
addopts = "--strict-markers"
markers = ["privileged: needs a host that allows privileged containers"]
