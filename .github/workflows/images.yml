name: images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  # Cancel superseded pull request runs; never cancel a main run mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/plume-works
  # Publish for same-repository pull requests (Renovate's included) and for main. Forks build and test only;
  # a manual run on another branch must not move edge.
  PUBLISH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}

jobs:
  # Only a change to an image builds and publishes; Renovate's pin bumps of our own images (.devcontainer.json,
  # templates/coder/) would otherwise loop. A manual run always builds.
  paths-filter:
    name: Need to run?
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      pass: ${{ steps.filter.outputs.pass == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      # A failed main run published nothing, so a push to main compares against the last commit this workflow
      # passed on, not the previous push.
      - name: Find the base commit
        id: shas
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          set-environment-variables-for-job: 'false'

      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.shas.outputs.base }}
          filters: |
            pass:
              - 'images/**'
              - '.github/scripts/images.sh'
              - '.github/workflows/images.yml'

  build:
    name: build-test (${{ matrix.arch }})
    needs: paths-filter
    if: needs.paths-filter.outputs.pass == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Default docker-container driver: push-by-digest is not available with the plain docker driver.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load and push are two outputs of one build, so the pushed bits are the tested bits.
      - name: Build every image of this commit, load it, and push it by digest if publishing
        env:
          PUSH: ${{ env.PUBLISH }}
        working-directory: images
        run: docker buildx bake --metadata-file "$RUNNER_TEMP/meta.json"

      - name: Smoke-test every image, parent first
        run: |
          images=$(.github/scripts/images.sh)
          for name in $images; do
            echo "::group::smoke $name"
            "images/$name/smoke.sh" "$REGISTRY/$name:ci"
            echo "::endgroup::"
          done

      - name: Record digests
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          jq 'with_entries(select(.value | type == "object" and has("containerimage.digest"))
                | .value |= .["containerimage.digest"])' \
            "$RUNNER_TEMP/meta.json" > "$RUNNER_TEMP/digests/${{ matrix.arch }}.json"
          cat "$RUNNER_TEMP/digests/${{ matrix.arch }}.json"

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.json
          retention-days: 1

  publish:
    needs: build
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag every image for both architectures
        env:
          TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'edge' }}
        run: |
          # If the registry fails partway, some images carry the new tag; re-run the job.
          # Assign first: a failed command substitution in a for list does not stop bash -e.
          images=$(.github/scripts/images.sh)
          for img in $images; do
            docker buildx imagetools create -t "$REGISTRY/$img:$TAG" \
              "$REGISTRY/$img@$(jq -r --arg i "$img" '.[$i]' "$RUNNER_TEMP/digests/amd64.json")" \
              "$REGISTRY/$img@$(jq -r --arg i "$img" '.[$i]' "$RUNNER_TEMP/digests/arm64.json")"
          done

  # The one required check: a skipped matrix job reports no check under its expanded name, so the build-test
  # checks cannot be required themselves.
  finished:
    name: CI finished
    needs: [paths-filter, build, publish]
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 10
    if: always()
    steps:
      - name: Execution was not needed!
        if: needs.paths-filter.outputs.pass != 'true'
        run: exit 0
      - name: All jobs succeeded!
        if: ${{ success() }}
        run: exit 0
      - name: Some jobs have failed!
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
      - name: Some jobs have been cancelled!
        if: ${{ cancelled() || contains(needs.*.result, 'cancelled') }}
        run: exit 1
