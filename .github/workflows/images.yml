# Build, test and publish every image of this repository.
#
# Shape (each step is data-driven from docker-bake.hcl, so adding an image needs no change here; the list of
# images, parent first, comes from .github/scripts/images.sh):
#   build-test (amd64), build-test (arm64)   one job per architecture, each on a native runner
#     1. bake builds all images of this commit once, children on this commit's parent, and loads them; if
#        publishing, the same build is also pushed by digest with no tag (two outputs of one build, so the pushed
#        bits are the tested bits; an untagged digest is not published until step 4 tags it)
#     2. images/<name>/smoke.sh runs against each image, parent first
#     3. if publishing and every smoke test passed: the digests are uploaded as an artifact
#   publish                                   runs only if every image passed on both architectures
#     4. tags every image for both architectures: pr-N for a pull request, edge for main
#
# So pr-N and edge move on all images or none: a failed smoke test on either architecture skips publish. If the
# registry fails partway through tagging, re-run the job.
# Pull requests from forks build and test only.
# pr-N tags are deleted when the pull request closes (pr-cleanup.yml).
name: images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  # Cancel superseded pull request runs; never cancel a main run mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/plume-works
  # Publish for same-repository pull requests (Renovate's included) and for main. Forks build and test only;
  # a manual run on another branch must not move edge.
  PUBLISH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}

jobs:
  build:
    name: build-test (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      # Default docker-container driver: push-by-digest is not available with the plain docker driver.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build. It is always loaded for the smoke tests; when publishing (PUSH), the same build is also
      # pushed by digest, untagged. Nothing is built a second time, so nothing untested can be pushed.
      - name: Build every image of this commit, load it, and push it by digest if publishing
        env:
          PUSH: ${{ env.PUBLISH }}
        run: docker buildx bake --metadata-file "$RUNNER_TEMP/meta.json"

      - name: Smoke-test every image, parent first
        run: |
          images=$(.github/scripts/images.sh)
          for name in $images; do
            echo "::group::smoke $name"
            "images/$name/smoke.sh" "$REGISTRY/$name:ci"
            echo "::endgroup::"
          done

      # Only reached when every smoke test passed: the publish job tags nothing it has no digest for.
      - name: Record digests
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          jq 'with_entries(select(.value | type == "object" and has("containerimage.digest"))
                | .value |= .["containerimage.digest"])' \
            "$RUNNER_TEMP/meta.json" > "$RUNNER_TEMP/digests/${{ matrix.arch }}.json"
          cat "$RUNNER_TEMP/digests/${{ matrix.arch }}.json"

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.json
          retention-days: 1

  publish:
    # needs: a failed or cancelled build on either architecture skips this job, so no tag moves.
    needs: build
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      # For the list of images: the bake file is its one source.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag every image for both architectures
        env:
          TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'edge' }}
        run: |
          # This job runs only if every image passed on both architectures (needs: build). If the registry fails
          # partway, some images carry the new tag; re-run the job.
          for img in $(.github/scripts/images.sh); do
            docker buildx imagetools create -t "$REGISTRY/$img:$TAG" \
              "$REGISTRY/$img@$(jq -r --arg i "$img" '.[$i]' "$RUNNER_TEMP/digests/amd64.json")" \
              "$REGISTRY/$img@$(jq -r --arg i "$img" '.[$i]' "$RUNNER_TEMP/digests/arm64.json")"
          done
