name: images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  # Cancel superseded pull request runs; never cancel a main run mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/plume-works
  # A manual run on another branch must not move edge.
  PUBLISH: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  # Only a change to an image builds and publishes; Renovate's pin bumps of our own images (.devcontainer.json,
  # templates/coder/) would otherwise loop. A manual run always builds.
  paths-filter:
    name: Need to run?
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      - id: filter
        uses: anton-matosov/actions/paths-filter@17af57d38e82bd8b73fc764101c4b94563c4d39e # v1.0.0
        with:
          force: ${{ github.event_name == 'workflow_dispatch' }}
          filters: |
            - 'images/**'
            - '.github/scripts/images.sh'
            - '.github/workflows/images.yml'

  build:
    name: build-test (${{ matrix.arch }})
    needs: paths-filter
    if: needs.paths-filter.outputs.pass == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Default docker-container driver: push-by-digest is not available with the plain docker driver.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Every run reads and writes the build cache in GHCR, publishing or not.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load and push are two outputs of one build, so the pushed bits are the tested bits.
      - name: Build every image of this commit, load it, and push it by digest if publishing
        env:
          PUSH: ${{ env.PUBLISH }}
          CACHE: true
        working-directory: images
        run: docker buildx bake --metadata-file "$RUNNER_TEMP/meta.json"

      - name: Smoke-test every image, parent first
        run: |
          images=$(.github/scripts/images.sh)
          for name in $images; do
            echo "::group::smoke $name"
            "images/$name/smoke.sh" "$REGISTRY/$name:ci"
            echo "::endgroup::"
          done

      - name: Record digests
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          jq 'with_entries(select(.value | type == "object" and has("containerimage.digest"))
                | .value |= .["containerimage.digest"])' \
            "$RUNNER_TEMP/meta.json" > "$RUNNER_TEMP/digests/${{ matrix.arch }}.json"
          cat "$RUNNER_TEMP/digests/${{ matrix.arch }}.json"

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.json
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag every image for both architectures
        env:
          TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'edge' }}
        run: |
          # If the registry fails partway, some images carry the new tag; re-run the job.
          # Assign first: a failed command substitution in a for list does not stop bash -e.
          images=$(.github/scripts/images.sh)
          for img in $images; do
            docker buildx imagetools create -t "$REGISTRY/$img:$TAG" \
              "$REGISTRY/$img@$(jq -r --arg i "$img" '.[$i]' "$RUNNER_TEMP/digests/amd64.json")" \
              "$REGISTRY/$img@$(jq -r --arg i "$img" '.[$i]' "$RUNNER_TEMP/digests/arm64.json")"
          done

  finished:
    name: CI finished
    needs: [paths-filter, build, publish]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 10
    steps:
      - uses: anton-matosov/actions/ci-finished@17af57d38e82bd8b73fc764101c4b94563c4d39e # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
