# Each architecture builds and tests the Core image on a native runner. pr-N (same-repo pull request) or edge
# (main) is published only if both pass and the pushed image has the tested image's config digest.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same-repository pull requests and main publish; fork pull requests and manual runs on other branches do not.
  PUBLISH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read the uv version
        id: uv
        run: echo "version=$(sed -n 's/^ARG UV_VERSION=//p' images/core/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
      - name: Build and load
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: core
          set: |
            core.cache-from=type=gha,scope=core-${{ matrix.arch }}
            core.cache-to=type=gha,scope=core-${{ matrix.arch }},mode=max
      - name: Test
        env:
          GHCR_TOKEN: ${{ env.PUBLISH == 'true' && github.token || '' }}
        run: uv run pytest
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: core
          set: |
            core.cache-from=type=gha,scope=core-${{ matrix.arch }}
            core.cache-to=type=gha,scope=core-${{ matrix.arch }},mode=max
            core.tags=ghcr.io/plume-works/core
            core.output=type=image,push-by-digest=true,name-canonical=true,push=true
      - name: Check the pushed image is the tested one
        if: env.PUBLISH == 'true'
        env:
          TESTED: ${{ steps.build.outputs.metadata }}
          PUSHED: ${{ steps.push.outputs.metadata }}
        run: |
          tested=$(jq -r '.core["containerimage.config.digest"] // empty' <<<"$TESTED")
          pushed=$(jq -r '.core["containerimage.config.digest"] // empty' <<<"$PUSHED")
          echo "tested: $tested"
          echo "pushed: $pushed"
          if [ -z "$tested" ] || [ -z "$pushed" ] || [ "$tested" != "$pushed" ]; then
            echo "::error::the pushed image is not the tested image"
            exit 1
          fi
      - name: Save the pushed digest
        if: env.PUBLISH == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          PUSHED: ${{ steps.push.outputs.metadata }}
        run: |
          mkdir -p digests
          jq -r '.core["containerimage.digest"]' <<<"$PUSHED" > "digests/${ARCH}"
      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error

  publish:
    # Job-level `if` cannot read the workflow `env`, so the PUBLISH expression is repeated.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Create manifest
        env:
          TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'edge' }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/plume-works/core:${TAG}" \
            "ghcr.io/plume-works/core@$(cat digests/amd64)" \
            "ghcr.io/plume-works/core@$(cat digests/arm64)"
