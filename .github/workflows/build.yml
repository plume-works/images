# Each architecture builds and tests the Core image on a native runner, then pushes that very image as
# <tag>-<arch> (pr-N for a same-repo pull request, edge for main). The publish job joins both architectures' digests
# into <tag>, only if both passed.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same-repository pull requests and main publish; fork pull requests and manual runs on other branches do not.
  PUBLISH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
  # Tag of the published image; the build jobs push ${TAG}-<arch>, the publish job joins them into ${TAG}.
  TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'edge' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read the uv version
        id: uv
        run: echo "version=$(sed -n 's/^ARG UV_VERSION=//p' images/core/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
      - name: Build and load
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: core
          set: |
            core.cache-from=type=gha,scope=core-${{ matrix.arch }}
            core.cache-to=type=gha,scope=core-${{ matrix.arch }},mode=max
      - name: Test
        env:
          GHCR_TOKEN: ${{ env.PUBLISH == 'true' && github.token || '' }}
        run: uv run pytest
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        if: env.PUBLISH == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag ghcr.io/plume-works/core:edge "ghcr.io/plume-works/core:${TAG}-${ARCH}"
          docker push "ghcr.io/plume-works/core:${TAG}-${ARCH}" | tee push.log
          digest=$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | tail -n 1)
          if [ -z "$digest" ]; then
            echo "::error::no digest in the push output"
            exit 1
          fi
          mkdir -p digests
          echo "$digest" > "digests/${ARCH}"
      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error

  publish:
    # Job-level `if` cannot read the workflow `env`, so the PUBLISH expression is repeated.
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Create manifest
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/plume-works/core:${TAG}" \
            "ghcr.io/plume-works/core@$(cat digests/amd64)" \
            "ghcr.io/plume-works/core@$(cat digests/arm64)"
