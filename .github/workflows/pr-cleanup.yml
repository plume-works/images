# Delete a pull request's pr-N tag from every image when the pull request closes (merged or not).
# The image list comes from the bake file (.github/scripts/images.sh), so adding an image needs no change here.
name: pr-cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-pr-tags:
    # Fork pull requests never published, and their token is read-only anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-cleanup  # the cleanup action is not safe to run in parallel on one package
    steps:
      - uses: actions/checkout@v7

      - name: List the images
        id: images
        run: |
          images=$(.github/scripts/images.sh)
          echo "packages=$(paste -sd, - <<<"$images")" >> "$GITHUB_OUTPUT"

      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ steps.images.outputs.packages }}
          delete-tags: pr-${{ github.event.pull_request.number }}
          # Safety net: a pr-N index can share per-architecture images with edge.
          exclude-tags: edge
