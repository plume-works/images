# Delete a pull request's pr-N, pr-N-amd64 and pr-N-arm64 tags when the pull request closes (merged or not).
name: pr-cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-pr-tag:
    # Fork pull requests never published, and their token is read-only anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-cleanup # the cleanup action is not safe to run in parallel on one package
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: core
          delete-tags: pr-${{ github.event.pull_request.number }},pr-${{ github.event.pull_request.number }}-amd64,pr-${{ github.event.pull_request.number }}-arm64
          # Safety net: a pr-N image can share per-architecture images with edge.
          exclude-tags: edge*
